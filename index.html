<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aditya Kumar — Conversational AI Engineer & Full-Stack Developer building speech AI, LLM agents and voice-driven fintech." />
    <meta name="theme-color" content="#09090b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Aditya Kumar · AI Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Conversia chatbot -->
    <script>
      window.conversiaSettings = {
        domain: "portfolio",
        mode: "chat",
        api: "https://3-109-227-84.sslip.io/api",
        app: "https://conversia-ps3o.onrender.com"
        // email: "visitor@example.com"  // optional, skips the email prompt
      };
    </script>
    <script>
      (function () {
        var w = window, d = document;
        var c = w.Conversia;
        if (typeof c === "function") {
          c("reattach");
          c("update", w.conversiaSettings);
        } else {
          var i = function () { i.c(arguments); };
          i.q = [];
          i.c = function (args) { i.q.push(args); };
          w.Conversia = i;
          var l = function () {
            var s = d.createElement("script");
            s.type = "text/javascript";
            s.async = true;
            s.src = w.conversiaSettings.app + "/widget.js";
            var x = d.getElementsByTagName("script")[0];
            x.parentNode.insertBefore(s, x);
          };
          if (d.readyState === "complete") { l(); }
          else { w.addEventListener("load", l, false); }
        }
      })();
    </script>
  </body>
</html>
